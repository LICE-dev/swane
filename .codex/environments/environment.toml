version = 1
name = "SWANe"

[setup]
script = "bash .codex/scripts/invoke-project-action.sh setup"

[setup.darwin]
script = "bash .codex/scripts/invoke-project-action.sh setup"

[setup.linux]
script = "bash .codex/scripts/invoke-project-action.sh setup"

[setup.win32]
script = 'powershell -NoProfile -ExecutionPolicy Bypass -File ".codex\scripts\Invoke-ProjectAction.ps1" -Action setup'

