name: Installer tests

# shellcheck and the unit tests of installer/install_swane.sh, then the real
# installer on clean hosted runners (Ubuntu, macOS arm64 with bash and with
# zsh as the login shell, macOS Intel),
# installing the SWANe of the commit under test, with a check of the result
# and a second run (the update path); two "update" legs (Ubuntu, macOS
# arm64) rerun it on the FSL update paths instead. The install-root job runs
# it as root in an ubuntu:24.04 container without sudo (a Docker image).
#
# Manual only (user decision): run it on demand with
#   gh workflow run installer-tests.yml -r <branch>
# which works once this file is on the default branch (dev).
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: installer-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    name: shellcheck and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: shellcheck
        shell: bash
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends shellcheck
          fi
          shellcheck --version
          shellcheck installer/install_swane.sh .github/scripts/check_installed_env.sh
      # zsh: the activation hook tests run under every shell found (bash, dash, zsh).
      - name: Install zsh
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zsh
      - name: Install SWANe
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - name: Installer unit tests
        shell: bash
        # CONDA_EXE pointing at the runner's conda enables the hook test under
        # the real "conda activate" (fake prefixes only, nothing is installed).
        run: |
          if [ -n "${CONDA:-}" ] && [ -x "$CONDA/bin/conda" ]; then
            export CONDA_EXE="$CONDA/bin/conda"
          fi
          python -m pytest swane/tests/installer -p no:cacheprovider -rfEs

  install:
    name: ${{ matrix.scenario }} (${{ matrix.os }}, ${{ matrix.conda }} conda, ${{ matrix.login_shell }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # Every leg names its login shell and its scenario: entries differing
        # only by a new key would be merged into an earlier one by GitHub's
        # "include".
        # scenario install: first run, checks, second run from a pipe.
        # scenario install-dir: the same, but the first run gets --install-dir
        # (the environments must be in that directory, not in conda's own) and
        # the second run does not: it must keep that choice (same env, no new
        # environment in conda's own directory).
        # scenario update: first run and checks, then the FSL
        # update paths (phases A, B, C below) instead of the second run.
        include:
          # fresh: no conda visible to the installer, which installs Miniforge.
          - os: ubuntu-latest
            conda: fresh
            login_shell: bash
            scenario: install
          # existing: the runner's own conda ($CONDA), found through CONDA_EXE.
          - os: ubuntu-latest
            conda: existing
            login_shell: bash
            scenario: install
          - os: macos-latest
            conda: fresh
            login_shell: bash
            scenario: install
          # GitHub's macOS runners have SHELL=/bin/bash, but zsh is the
          # default login shell of a Mac: this leg runs the installer and
          # every check with SHELL=/bin/zsh (the installer picks the PATH
          # file from $SHELL), and the FSL hook check under zsh too.
          - os: macos-latest
            conda: fresh
            login_shell: zsh
            scenario: install
          # macos-15-intel is GitHub's last Intel (x86_64) macOS image,
          # supported until fall 2027: drop this leg then. It is the only CI
          # coverage of macOS Intel (TensorFlow from conda-forge).
          - os: macos-15-intel
            conda: fresh
            login_shell: bash
            scenario: install
          - os: ubuntu-latest
            conda: fresh
            login_shell: bash
            scenario: install-dir
          - os: macos-latest
            conda: fresh
            login_shell: bash
            scenario: install-dir
          # The FSL update paths: Linux and macOS arm64,
          # not macOS Intel.
          - os: ubuntu-latest
            conda: fresh
            login_shell: bash
            scenario: update
          - os: macos-latest
            conda: fresh
            login_shell: bash
            scenario: update
    env:
      CONDA_MODE: ${{ matrix.conda }}
      SCENARIO: ${{ matrix.scenario }}
      LOGIN_SHELL: ${{ matrix.login_shell }}
      EXPECT_CONDA_TENSORFLOW: ${{ matrix.os == 'macos-15-intel' }}
    steps:
      - uses: actions/checkout@v7
      # Job variables for every later step: the login shell (SHELL=/bin/zsh
      # on the zsh leg), the summary files, the expected conda root and PATH
      # startup file, the shell invocations that must find swane, and a PATH
      # without ~/.local/bin (so the installer adds it through that file, as
      # on a user's machine) and, for the fresh legs, with no runner conda on
      # it (asserted).
      - name: Prepare the runner
        shell: bash
        run: |
          echo "Runner login shell: SHELL=${SHELL:-<unset>}"
          if [ "$LOGIN_SHELL" = zsh ]; then
            if [ ! -x /bin/zsh ]; then
              echo "::error::No /bin/zsh on this runner"
              exit 1
            fi
            SHELL=/bin/zsh
          fi
          if [ -z "${SHELL:-}" ]; then
            echo "::error::SHELL is unset: the installer cannot choose a startup file"
            exit 1
          fi
          if [ "$(basename -- "$SHELL")" != "$LOGIN_SHELL" ]; then
            echo "::error::SHELL is $SHELL, but this leg is the $LOGIN_SHELL one"
            exit 1
          fi
          echo "Login shell of this leg: SHELL=$SHELL"
          # The one file install_swane.sh's path_startup_file picks,
          # decided before the installer can create any of them, and
          # the invocations of $SHELL that read it: Linux terminals start
          # interactive non-login shells (-ic), macOS Terminal login shells
          # (-lic); every interactive zsh reads ~/.zshrc. A bash login shell
          # on Linux (-lc) is not checked: by design only ~/.bashrc gets the
          # block, and the stock ~/.bashrc returns early when not interactive.
          shell_name="$(basename -- "$SHELL" | tr '[:upper:]' '[:lower:]')"
          case "$shell_name/$RUNNER_OS" in
            zsh/macOS)
              expected_file="$HOME/.zshrc"
              shell_flags="-ic -lic"
              ;;
            bash/Linux)
              expected_file="$HOME/.bashrc"
              shell_flags="-ic"
              ;;
            bash/macOS)
              # bash login reads only the first of these: the installer
              # never creates .bash_profile next to the others.
              expected_file="$HOME/.bash_profile"
              for file in "$HOME/.bash_profile" "$HOME/.bash_login" "$HOME/.profile"; do
                if [ -f "$file" ]; then
                  expected_file="$file"
                  break
                fi
              done
              shell_flags="-lic"
              ;;
            *)
              echo "::error::Login shell $SHELL on $RUNNER_OS is not covered by this workflow"
              exit 1
              ;;
          esac
          echo "Expected PATH startup file: $expected_file (checked with: $shell_flags)"
          # Physical path of a directory (symlinks resolved, so /bin and
          # /usr/bin compare equal on a usrmerge system); empty if missing.
          physical_dir() { (cd -P -- "$1" 2>/dev/null && pwd -P) || true; }
          # System bin dirs stay on PATH in fresh mode (the Ubuntu image links
          # its Miniconda as /usr/bin/conda): their conda file is deleted
          # instead, which is fine on a disposable hosted runner.
          system_dirs=":"
          for dir in /usr/bin /bin /usr/sbin /sbin /usr/local/bin /usr/local/sbin; do
            resolved="$(physical_dir "$dir")"
            if [ -n "$resolved" ]; then
              system_dirs="$system_dirs$resolved:"
            fi
          done
          IFS=: read -r -a path_dirs <<<"$PATH"
          new_path=""
          for dir in "${path_dirs[@]}"; do
            case "$dir" in
              "" | "$HOME/.local/bin" | "$HOME/.local/bin/") continue ;;
            esac
            if [ "$CONDA_MODE" = fresh ] && [ -x "$dir/conda" ]; then
              resolved="$(physical_dir "$dir")"
              case "$system_dirs" in
                *":$resolved:"*)
                  target="$(readlink -f -- "$dir/conda" 2>/dev/null || echo "<unresolved>")"
                  if ! sudo -n rm -f -- "$dir/conda"; then
                    echo "::error::Could not remove the runner conda $dir/conda"
                    exit 1
                  fi
                  echo "Removed runner conda: $dir/conda (pointed to $target); $dir kept on PATH"
                  ;;
                *)
                  echo "Removed from PATH (runner conda): $dir"
                  continue
                  ;;
              esac
            fi
            new_path="${new_path:+$new_path:}$dir"
          done
          # A green fresh leg must prove the installer starts with no conda.
          if [ "$CONDA_MODE" = fresh ]; then
            if found="$(PATH="$new_path" command -v conda)"; then
              echo "::error::A conda is still on the fresh-leg PATH: $found"
              exit 1
            fi
            echo "No conda on the fresh-leg PATH"
            # The fixed roots install_swane.sh's find_conda probes besides
            # PATH (MINIFORGE_PREFIX defaults to ~/miniforge3, and
            # SWANE_SYSTEM_CONDA_ROOTS to /opt/conda): none may exist.
            for root in "$HOME/miniforge3" "$HOME/miniconda3" "$HOME/anaconda3" /opt/conda; do
              if [ -e "$root" ] || [ -L "$root" ]; then
                echo "::error::$root exists: the fresh leg would not start without a conda"
                exit 1
              fi
            done
            echo "No conda root in the installer's fixed candidates"
          fi
          conda_exe=""
          expected_root="$HOME/miniforge3"
          if [ "$CONDA_MODE" = existing ]; then
            if [ -z "${CONDA:-}" ] || [ ! -x "$CONDA/bin/conda" ]; then
              echo "::error::The runner has no conda in \$CONDA (${CONDA:-unset})"
              exit 1
            fi
            "$CONDA/bin/conda" --version
            conda_exe="$CONDA/bin/conda"
            expected_root="$CONDA"
          fi
          {
            echo "PATH=$new_path"
            echo "SUMMARY_1=$RUNNER_TEMP/installer-summary-1.txt"
            echo "SUMMARY_2=$RUNNER_TEMP/installer-summary-2.txt"
            echo "EXPECTED_CONDA_ROOT=$expected_root"
            echo "SHELL=$SHELL"
            echo "SHELL_NAME=$shell_name"
            echo "EXPECTED_PATH_FILE=$expected_file"
            echo "SHELL_FLAGS=$shell_flags"
            if [ -n "$conda_exe" ]; then
              echo "CONDA_EXE=$conda_exe"
            fi
            if [ "$SCENARIO" = install-dir ]; then
              echo "INSTALL_DIR=$RUNNER_TEMP/swane-envs"
            fi
          } >> "$GITHUB_ENV"
      # /bin/bash: on macOS that is bash 3.2, the shell of "curl ... | bash".
      # Only stdout (the summary) goes to the file; the log stays on stderr.
      # Any summary warning fails the job: a clean hosted runner expects none
      # (e.g. a renamed apt package would otherwise leave CI green).
      - name: Run the installer
        shell: bash
        run: |
          if [ "$CONDA_MODE" = fresh ]; then
            unset CONDA_EXE
          fi
          /bin/bash installer/install_swane.sh --yes --accept-fsl-license \
            --swane-spec "$GITHUB_WORKSPACE" ${INSTALL_DIR:+--install-dir "$INSTALL_DIR"} | tee "$SUMMARY_1"
          grep -qxF "SWANe installer: conda $EXPECTED_CONDA_ROOT" "$SUMMARY_1" ||
            { echo "::error::Expected the conda in $EXPECTED_CONDA_ROOT"; exit 1; }
          grep -qE '^SWANe installer: FSL .* installed$' "$SUMMARY_1" ||
            { echo "::error::Expected FSL to be installed on a runner without FSL"; exit 1; }
          # --install-dir: both environments in that directory, none in conda's.
          if [ -n "${INSTALL_DIR:-}" ]; then
            grep -qxF "SWANe installer: env $INSTALL_DIR/swane-env" "$SUMMARY_1" ||
              { echo "::error::Expected swane-env in $INSTALL_DIR/swane-env"; exit 1; }
            grep -qE "^SWANe installer: FSL $INSTALL_DIR/swane-fsl " "$SUMMARY_1" ||
              { echo "::error::Expected swane-fsl in $INSTALL_DIR/swane-fsl"; exit 1; }
            for name in swane-env swane-fsl; do
              [ -x "$INSTALL_DIR/$name/bin/python" ] ||
                { echo "::error::No environment in $INSTALL_DIR/$name"; exit 1; }
              if [ -e "$EXPECTED_CONDA_ROOT/envs/$name" ]; then
                echo "::error::$name was also created in $EXPECTED_CONDA_ROOT/envs"
                exit 1
              fi
            done
          fi
          if grep -q '^WARNING: ' "$SUMMARY_1"; then
            sed -n 's/^WARNING: \(.*\)/::error::Installer warning: \1/p' "$SUMMARY_1"
            exit 1
          fi
      # The list is read from the script itself (sourcing it never runs main),
      # so it cannot drift from what the installer installs.
      - name: Check the Linux system packages
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        run: |
          # shellcheck disable=SC2016 # expanded by the inner bash
          apt_list="$(bash -c '. installer/install_swane.sh && printf "%s\n" "$APT_PACKAGES"')"
          read -r -a packages <<<"$apt_list"
          [ "${#packages[@]}" -gt 0 ] || { echo "::error::Could not read APT_PACKAGES from the installer"; exit 1; }
          native_arch="$(dpkg --print-architecture)"
          # The package of the native architecture (on a multi-arch host
          # dpkg-query prints one status per architecture), else the plain
          # name for an "Architecture: all" package; first status line only.
          installed() {
            local status
            # shellcheck disable=SC2016 # dpkg-query format, not a shell expansion
            status="$(dpkg-query -W -f='${Status}\n' "$1:$native_arch" 2>/dev/null ||
              dpkg-query -W -f='${Status}\n' "$1" 2>/dev/null || true)"
            [ "$(printf '%s\n' "$status" | head -n 1)" = "install ok installed" ]
          }
          missing=""
          for pkg in "${packages[@]}"; do
            installed "$pkg" || missing="$missing $pkg"
          done
          installed libasound2t64 || installed libasound2 || missing="$missing libasound2t64|libasound2"
          if [ -n "$missing" ]; then
            echo "::error::System packages not installed:$missing"
            exit 1
          fi
          echo "All ${#packages[@]} packages and libasound2t64/libasound2 are installed"
      # The launcher runs bash; the zsh leg also activates swane-env in
      # zsh, as a default macOS terminal does, so the FSL hook is sourced by
      # zsh (same checks: wrappers, $FSLDIR/bin absent, exact PATH after
      # conda deactivate).
      - name: Check the environment
        shell: bash
        timeout-minutes: 20
        run: |
          bash -l .github/scripts/check_installed_env.sh "$SUMMARY_1"
          if [ "$SHELL_NAME" = zsh ]; then
            CHECK_SHELL=zsh zsh -l .github/scripts/check_installed_env.sh "$SUMMARY_1"
          fi
      # Qt's xcb platform starts in swane-env on a virtual X
      # display (xvfb only on the runner, never through the installer). A
      # failure means a runtime library is missing: add its package to
      # APT_PACKAGES, never skip this check.
      - name: Check that Qt starts with the xcb platform
        if: ${{ runner.os == 'Linux' && startsWith(matrix.scenario, 'install') }}
        shell: bash
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb
          launcher="$HOME/.local/bin/swane"
          pin() { sed -n "s/^$1='\\(.*\\)'\$/\\1/p" "$launcher" | head -n 1 | sed "s/'\\\\''/'/g"; }
          root="$(pin SWANE_CONDA_ROOT)"
          prefix="$(pin SWANE_ENV_PREFIX)"
          if [ -z "$root" ] || [ -z "$prefix" ]; then
            echo "::error::No conda pins in $launcher"
            exit 1
          fi
          set +u
          # shellcheck disable=SC1091 # exists only on the runner
          . "$root/etc/profile.d/conda.sh"
          conda activate "$prefix"
          export PYTHONNOUSERSITE=1 QT_QPA_PLATFORM=xcb
          snippet='from PySide6.QtWidgets import QApplication
          app = QApplication([])
          print("Qt platform:", app.platformName())
          assert app.platformName() == "xcb", app.platformName()'
          if ! timeout 120 xvfb-run -a python -c "$snippet"; then
            echo "::error::PySide6 QApplication does not start with QT_QPA_PLATFORM=xcb: Qt's plugin log follows"
            QT_DEBUG_PLUGINS=1 timeout 120 xvfb-run -a python -c "$snippet" || true
            exit 1
          fi
      # New shells of the user's own shell, with a minimal environment, in
      # the kinds a new terminal starts (SHELL_FLAGS, from the Prepare step):
      # swane must come from the PATH block of the one startup file.
      - name: Check swane in new shells
        shell: bash
        run: |
          read -r -a flags_list <<<"$SHELL_FLAGS"
          for flags in "${flags_list[@]}"; do
            # shellcheck disable=SC2016 # expanded by the new shell
            output="$(env -i HOME="$HOME" USER="$USER" LOGNAME="${LOGNAME:-$USER}" \
              SHELL="$SHELL" TERM=dumb PATH=/usr/bin:/bin \
              "$SHELL" "$flags" 'printf "SWANE_RESOLVED=%s\n" "$(command -v swane)"' </dev/null)"
            echo "$SHELL $flags: $output"
            resolved="$(printf '%s\n' "$output" | sed -n 's/^SWANE_RESOLVED=//p' | tail -n 1)"
            if [ "$resolved" != "$HOME/.local/bin/swane" ]; then
              echo "::error::swane resolves to '$resolved' in '$SHELL $flags', not $HOME/.local/bin/swane"
              exit 1
            fi
          done
      # As users run it: the script through a pipe ("curl ... | bash -s --
      # ..."); pipefail keeps an installer failure. The installer log
      # (stderr) stays live in the job log and is also saved, so that on
      # Linux it can prove the system step found everything already present:
      # no sudo question, no apt-get, no locale-gen. Its tee is a stage of
      # the pipeline (fd 3 carries the installer's stdout past it), so the
      # pipeline waits for it and the file is complete before the checks.
      - name: Run the installer again from a pipe (update path)
        if: ${{ startsWith(matrix.scenario, 'install') }}
        shell: bash
        run: |
          if [ "$CONDA_MODE" = fresh ]; then
            unset CONDA_EXE
          fi
          rerun_log="$RUNNER_TEMP/installer-log-2.txt"
          status=0
          {
            # shellcheck disable=SC2002 # a real pipe, as with curl
            cat installer/install_swane.sh |
              /bin/bash -s -- --yes --accept-fsl-license --swane-spec "$GITHUB_WORKSPACE" 2>&1 >&3 3>&- |
              tee "$rerun_log" >&2 3>&-
          } 3>&1 | tee "$SUMMARY_2" || status=$?
          if [ "$status" != 0 ]; then
            echo "::error::The second run failed (exit $status)"
            exit "$status"
          fi
          # Linux system step (install_swane.sh linux_system_step): its
          # nothing-missing line must be there, and none of the lines that
          # precede the question, apt-get or locale-gen.
          if [ "$RUNNER_OS" = Linux ]; then
            if [ ! -s "$rerun_log" ]; then
              echo "::error::No installer log captured from the second run"
              exit 1
            fi
            if ! grep -qxF '==> The system packages for 3D Slicer and the en_US.UTF-8 locale are already installed' "$rerun_log"; then
              echo "::error::The second run did not find the system packages and the locale already installed"
              exit 1
            fi
            for line in 'Linux system setup: ' 'Run the Linux system setup steps above?' \
              '==> Installing system packages for 3D Slicer' '==> Generating the en_US.UTF-8 locale'; do
              if grep -qF -- "$line" "$rerun_log"; then
                echo "::error::The second run ran the Linux system setup: found '$line'"
                exit 1
              fi
            done
            echo "Second run: system packages and locale already present, no sudo question, no apt-get"
          fi
          grep -qE '^SWANe installer: FSL .* existing$' "$SUMMARY_2" ||
            { echo "::error::Expected the second run to reuse the FSL of the first one"; exit 1; }
          if [ -n "${INSTALL_DIR:-}" ]; then
            for name in swane-env swane-fsl; do
              if [ -e "$EXPECTED_CONDA_ROOT/envs/$name" ]; then
                echo "::error::The second run (no --install-dir) created $name in $EXPECTED_CONDA_ROOT/envs"
                exit 1
              fi
            done
          fi
          first="$(grep -E '^SWANe installer: (conda|env) ' "$SUMMARY_1")"
          second="$(grep -E '^SWANe installer: (conda|env) ' "$SUMMARY_2")"
          if [ "$first" != "$second" ]; then
            echo "::error::The second run changed conda or swane-env"
            printf 'first run:\n%s\nsecond run:\n%s\n' "$first" "$second"
            exit 1
          fi
          if grep -q '^WARNING: ' "$SUMMARY_2"; then
            sed -n 's/^WARNING: \(.*\)/::error::Installer warning: \1/p' "$SUMMARY_2"
            exit 1
          fi
          # One PATH block, in the one file the installer picks for $SHELL,
          # never duplicated by a rerun, and none in any other startup file.
          bad=0
          for file in .zshrc .zprofile .zshenv .zlogin .bashrc .bash_profile .bash_login .profile; do
            count="$(grep -c '^# >>> SWANe installer >>>$' "$HOME/$file" 2>/dev/null || true)"
            count="${count:-0}"
            if [ "$HOME/$file" = "$EXPECTED_PATH_FILE" ]; then
              expected=1
            else
              expected=0
            fi
            echo "$HOME/$file: $count PATH block(s), expected $expected"
            if [ "$count" != "$expected" ]; then
              echo "::error::Expected $expected SWANe PATH block(s) in $HOME/$file, found $count"
              bad=1
            fi
          done
          [ "$bad" = 0 ] || exit 1
      - name: Check the environment after the second run
        if: ${{ startsWith(matrix.scenario, 'install') }}
        shell: bash
        timeout-minutes: 20
        run: |
          bash -l .github/scripts/check_installed_env.sh "$SUMMARY_2"
          if [ "$SHELL_NAME" = zsh ]; then
            CHECK_SHELL=zsh zsh -l .github/scripts/check_installed_env.sh "$SUMMARY_2"
          fi
      # The FSL update paths, one phase after the other on the
      # install of the first run (fresh conda, so CONDA_EXE stays unset).
      #   A: swane-fsl lost its command wrappers -> a rerun updates it and
      #      recreates them;
      #   B: an FSL in a custom directory, as a plain conda create of the
      #      packages swane.utils.fsl_conda lists (FSL's conda channel) makes
      #      it: share/fsl/bin without bet, flirt or fsl-cluster wrappers;
      #      given as FSLDIR -> not reused and left untouched, swane-env
      #      keeps the installer's swane-fsl;
      #   C: the same FSL after createFSLWrapper (run as a black box, as the
      #      installer runs it, on that share/fsl/bin) -> reused as it is.
      # Every run must end without a summary warning, and the environment
      # check runs after each one. Portable to macOS (BSD sed/grep, bash 3.2).
      - name: FSL update paths (phases A, B, C)
        if: ${{ matrix.scenario == 'update' }}
        shell: bash
        timeout-minutes: 80
        run: |
          unset CONDA_EXE FSLDIR FSL_CREATE_WRAPPER_SCRIPTS
          fail() { echo "::error::$*"; exit 1; }
          # fsl_result SUMMARY: "<FSL dir>|<state>" from the summary FSL line.
          fsl_result() {
            sed -n 's/^SWANe installer: FSL \(.*\) ([^()]*) \([a-z]*\)$/\1|\2/p' "$1" | head -n 1
          }
          conda_root="$(sed -n 's/^SWANe installer: conda //p' "$SUMMARY_1" | head -n 1)"
          env_prefix="$(sed -n 's/^SWANe installer: env //p' "$SUMMARY_1" | head -n 1)"
          if [ -z "$conda_root" ] || [ -z "$env_prefix" ]; then
            fail "No conda or env line in $SUMMARY_1"
          fi
          # hook_written: the FSLDIR the activation hook of swane-env sets
          # (read with the installer's own function).
          hook_written() {
            # shellcheck disable=SC2016 # expanded by the inner bash
            bash -c '. installer/install_swane.sh && hook_written_fsldir "$1"' _ "$env_prefix"
          }
          # run_installer PHASE [FSLDIR]: run the installer (FSLDIR exported
          # only when given), log live and saved; it must succeed, keep the
          # conda and swane-env of the first run, and warn about nothing.
          run_installer() {
            local phase="$1" fsldir="${2:-}" rc=0 summary log
            summary="$RUNNER_TEMP/installer-summary-$phase.txt"
            log="$RUNNER_TEMP/installer-log-$phase.txt"
            {
              if [ -n "$fsldir" ]; then
                export FSLDIR="$fsldir"
              fi
              /bin/bash installer/install_swane.sh --yes --accept-fsl-license \
                --swane-spec "$GITHUB_WORKSPACE" 2>&1 >&3 3>&- | tee "$log" >&2 3>&-
            } 3>&1 | tee "$summary" || rc=$?
            [ "$rc" = 0 ] || fail "Phase $phase: the installer failed (exit $rc)"
            grep -qxF "SWANe installer: conda $conda_root" "$summary" ||
              fail "Phase $phase: the conda changed"
            grep -qxF "SWANe installer: env $env_prefix" "$summary" ||
              fail "Phase $phase: swane-env changed"
            if grep -q '^WARNING: ' "$summary"; then
              sed -n 's/^WARNING: \(.*\)/::error::Installer warning: \1/p' "$summary"
              exit 1
            fi
          }
          # no_fsl_install PHASE: the run neither installed nor updated an FSL.
          no_fsl_install() {
            local line
            for line in '==> Installing FSL ' '==> Updating FSL in '; do
              if grep -qF -- "$line" "$RUNNER_TEMP/installer-log-$1.txt"; then
                fail "Phase $1: unexpected '$line' in the installer log"
              fi
            done
          }
          wrappers_present() {
            local tool
            for tool in bet flirt fsl-cluster; do
              if [ ! -f "$1/share/fsl/bin/$tool" ] || [ ! -x "$1/share/fsl/bin/$tool" ]; then
                return 1
              fi
            done
          }

          echo "::group::Phase A: swane-fsl without its command wrappers"
          result="$(fsl_result "$SUMMARY_1")"
          swane_fsl="${result%|*}"
          [ "${result#*|}" = installed ] || fail "Expected the first run to install FSL: '$result'"
          [ -f "$swane_fsl/etc/swane_installer_fsl" ] || fail "No installer marker in $swane_fsl"
          release="$(head -n 1 "$swane_fsl/etc/fslversion")"
          wrappers_present "$swane_fsl" || fail "The first run left no wrappers in $swane_fsl/share/fsl/bin"
          for tool in bet flirt fsl-cluster; do
            rm -f "$swane_fsl/share/fsl/bin/$tool"
          done
          if wrappers_present "$swane_fsl"; then
            fail "Could not delete the wrappers in $swane_fsl"
          fi
          run_installer A
          [ "$(fsl_result "$RUNNER_TEMP/installer-summary-A.txt")" = "$swane_fsl|updated" ] ||
            fail "Phase A: expected '$swane_fsl ... updated' in the summary"
          grep -qF -- "in $swane_fsl (installed by this installer) lacks the FSL command wrappers" \
            "$RUNNER_TEMP/installer-log-A.txt" || fail "Phase A: the update was not due to the missing wrappers"
          wrappers_present "$swane_fsl" || fail "Phase A: the wrappers were not recreated in $swane_fsl"
          [ "$(hook_written)" = "$swane_fsl" ] || fail "Phase A: the hook's FSLDIR is not $swane_fsl"
          EXPECT_FSLDIR="$swane_fsl" bash -l .github/scripts/check_installed_env.sh \
            "$RUNNER_TEMP/installer-summary-A.txt"
          echo "::endgroup::"

          echo "::group::Phase B: a custom FSL without command wrappers"
          custom="$HOME/custom-fsl"
          [ ! -e "$custom" ] || fail "$custom already exists"
          resolved="$(PYTHONNOUSERSITE=1 "$env_prefix/bin/python" -I -m swane.utils.fsl_conda --format github </dev/null)" ||
            fail "Could not resolve the FSL packages"
          custom_release="$(printf '%s\n' "$resolved" | sed -n 's/^release=//p' | head -n 1)"
          specs="$(printf '%s\n' "$resolved" | sed -n 's/^specs=//p' | head -n 1)"
          if [ -z "$custom_release" ] || [ -z "$specs" ]; then
            fail "No release or specs from the FSL resolver: $resolved"
          fi
          [ "$custom_release" = "$release" ] || fail "The resolver gives FSL $custom_release, swane-fsl has $release"
          # shellcheck disable=SC2016 # expanded by the inner bash
          channel="$(bash -c '. installer/install_swane.sh && printf "%s\n" "$FSL_CHANNEL"')"
          read -r -a spec_list <<<"$specs"
          "$conda_root/bin/conda" create -y -p "$custom" --override-channels \
            --strict-channel-priority -c "$channel" -c conda-forge "${spec_list[@]}" </dev/null
          [ -x "$custom/bin/bet" ] || fail "No $custom/bin/bet: not an FSL"
          [ -x "$custom/bin/createFSLWrapper" ] || fail "No $custom/bin/createFSLWrapper"
          # The FSL as conda made it: share/fsl/bin may hold the files of
          # FSL's own packages, but none of the command wrappers the
          # installer requires (no createFSLWrapper run yet).
          listing() {
            if [ -d "$1" ]; then
              ls -A "$1"
            fi
          }
          custom_bin_before="$(listing "$custom/share/fsl/bin")"
          echo "$custom/share/fsl/bin before run B: ${custom_bin_before:-<absent or empty>}"
          for tool in bet flirt fsl-cluster; do
            if [ -e "$custom/share/fsl/bin/$tool" ]; then
              fail "conda put a $tool wrapper in $custom/share/fsl/bin: phase B needs an FSL without wrappers"
            fi
          done
          mkdir -p "$custom/etc"
          printf '%s\n' "$release" >"$custom/etc/fslversion"
          run_installer B "$custom"
          [ "$(fsl_result "$RUNNER_TEMP/installer-summary-B.txt")" = "$swane_fsl|existing" ] ||
            fail "Phase B: expected swane-fsl ($swane_fsl) existing in the summary, not the custom FSL"
          grep -qF -- "Leaving FSL $release in $custom aside" "$RUNNER_TEMP/installer-log-B.txt" ||
            fail "Phase B: the installer did not leave the custom FSL aside"
          no_fsl_install B
          [ "$(hook_written)" = "$swane_fsl" ] || fail "Phase B: the hook's FSLDIR is not $swane_fsl"
          [ "$(listing "$custom/share/fsl/bin")" = "$custom_bin_before" ] ||
            fail "Phase B: the installer changed $custom/share/fsl/bin"
          [ ! -e "$custom/etc/swane_installer_fsl" ] || fail "Phase B: the installer marked $custom"
          EXPECT_FSLDIR="$swane_fsl" bash -l .github/scripts/check_installed_env.sh \
            "$RUNNER_TEMP/installer-summary-B.txt"
          echo "::endgroup::"

          echo "::group::Phase C: the custom FSL with command wrappers"
          # The programs of FSL's packages, as the installer lists them, and
          # createFSLWrapper with the environment the installer gives it.
          # shellcheck disable=SC2016 # expanded by the inner bash
          names="$(bash -c '. installer/install_swane.sh && fsl_executables "$1" "$2"' _ "$env_prefix" "$custom")" ||
            fail "Could not list the programs of $custom"
          programs=()
          while IFS= read -r name; do
            if [ -n "$name" ]; then
              programs+=("$name")
            fi
          done <<EOF
          $names
          EOF
          [ "${#programs[@]}" -gt 0 ] || fail "No program of FSL's packages in $custom"
          FSLDIR="$custom" PREFIX="$custom" FSL_CREATE_WRAPPER_SCRIPTS=1 PYTHONNOUSERSITE=1 \
            "$custom/bin/createFSLWrapper" "${programs[@]}" </dev/null
          wrappers_present "$custom" || fail "createFSLWrapper did not create the wrappers in $custom"
          run_installer C "$custom"
          [ "$(fsl_result "$RUNNER_TEMP/installer-summary-C.txt")" = "$custom|existing" ] ||
            fail "Phase C: expected '$custom ... existing' in the summary"
          grep -qF -- "==> Using FSL $release in $custom" "$RUNNER_TEMP/installer-log-C.txt" ||
            fail "Phase C: the installer did not use the custom FSL as it is"
          no_fsl_install C
          [ "$(hook_written)" = "$custom" ] || fail "Phase C: the hook's FSLDIR is not $custom"
          EXPECT_FSLDIR="$custom" EXPECT_INSTALLER_FSL=false bash -l .github/scripts/check_installed_env.sh \
            "$RUNNER_TEMP/installer-summary-C.txt"
          echo "::endgroup::"

  # Root without sudo, as in a Docker container: an ubuntu:24.04 image has
  # neither sudo nor the locales package (every real Ubuntu install has it,
  # through ubuntu-minimal), and no curl. The preparation installs only what
  # the installer itself needs (curl, ca-certificates), locales and git (for
  # actions/checkout): the installer must then install the system packages
  # as root directly, generate the locale, and end with no warning.
  install-root:
    name: install as root without sudo (ubuntu:24.04 container)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container: ubuntu:24.04
    # SHELL is unset in the container: the installer picks the PATH startup
    # file from it. DEBIAN_FRONTEND is set for the preparation only, so the
    # installer's own apt-get runs as a user's would.
    env:
      SHELL: /bin/bash
    defaults:
      run:
        shell: bash
    steps:
      - name: Prepare the container
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git locales
      - uses: actions/checkout@v7
      - name: Check root without sudo
        run: |
          [ "$(id -u)" = 0 ] || { echo "::error::Not root: $(id)"; exit 1; }
          if found="$(command -v sudo)"; then
            echo "::error::sudo is installed in the container: $found"
            exit 1
          fi
          if locale -a 2>/dev/null | grep -Eiq '^en_US\.utf-?8$'; then
            echo "::error::en_US.UTF-8 already exists: the locale step would not run"
            exit 1
          fi
          echo "Root (HOME=$HOME), no sudo, no en_US.UTF-8 locale"
          {
            echo "SUMMARY_1=$RUNNER_TEMP/installer-summary-1.txt"
            echo "SUMMARY_2=$RUNNER_TEMP/installer-summary-2.txt"
            echo "LOG_1=$RUNNER_TEMP/installer-log-1.txt"
            echo "LOG_2=$RUNNER_TEMP/installer-log-2.txt"
          } >> "$GITHUB_ENV"
      # The log (stderr) stays live in the job log and is also saved; fd 3
      # carries the summary (stdout) past its tee, as in the install job.
      - name: Run the installer
        run: |
          status=0
          {
            /bin/bash installer/install_swane.sh --yes --accept-fsl-license \
              --swane-spec "$GITHUB_WORKSPACE" 2>&1 >&3 3>&- | tee "$LOG_1" >&2 3>&-
          } 3>&1 | tee "$SUMMARY_1" || status=$?
          [ "$status" = 0 ] || { echo "::error::The installer failed (exit $status)"; exit "$status"; }
          grep -qxF "SWANe installer: conda $HOME/miniforge3" "$SUMMARY_1" ||
            { echo "::error::Expected the conda in $HOME/miniforge3"; exit 1; }
          grep -qE '^SWANe installer: FSL .* installed$' "$SUMMARY_1" ||
            { echo "::error::Expected FSL to be installed"; exit 1; }
          grep -qF 'Linux system setup: these steps run as root:' "$LOG_1" ||
            { echo "::error::The system setup did not run as root"; exit 1; }
          for line in '==> Installing system packages for 3D Slicer' '==> Generating the en_US.UTF-8 locale'; do
            grep -qxF -- "$line" "$LOG_1" || { echo "::error::Missing from the log: '$line'"; exit 1; }
          done
          if grep -q '^WARNING: ' "$SUMMARY_1"; then
            sed -n 's/^WARNING: \(.*\)/::error::Installer warning: \1/p' "$SUMMARY_1"
            exit 1
          fi
          locale -a | grep -Eiq '^en_US\.utf-?8$' ||
            { echo "::error::No en_US.UTF-8 locale after the installer"; exit 1; }
      - name: Check the Linux system packages
        run: |
          # shellcheck disable=SC2016 # expanded by the inner bash
          apt_list="$(bash -c '. installer/install_swane.sh && printf "%s\n" "$APT_PACKAGES"')"
          read -r -a packages <<<"$apt_list"
          [ "${#packages[@]}" -gt 0 ] || { echo "::error::Could not read APT_PACKAGES from the installer"; exit 1; }
          native_arch="$(dpkg --print-architecture)"
          installed() {
            local status
            # shellcheck disable=SC2016 # dpkg-query format, not a shell expansion
            status="$(dpkg-query -W -f='${Status}\n' "$1:$native_arch" 2>/dev/null ||
              dpkg-query -W -f='${Status}\n' "$1" 2>/dev/null || true)"
            [ "$(printf '%s\n' "$status" | head -n 1)" = "install ok installed" ]
          }
          missing=""
          for pkg in "${packages[@]}"; do
            installed "$pkg" || missing="$missing $pkg"
          done
          installed libasound2t64 || installed libasound2 || missing="$missing libasound2t64|libasound2"
          if [ -n "$missing" ]; then
            echo "::error::System packages not installed:$missing"
            exit 1
          fi
          echo "All ${#packages[@]} packages and libasound2t64/libasound2 are installed"
      - name: Check the environment
        timeout-minutes: 20
        run: bash -l .github/scripts/check_installed_env.sh "$SUMMARY_1"
      - name: Run the installer again from a pipe (update path)
        run: |
          status=0
          {
            # shellcheck disable=SC2002 # a real pipe, as with curl
            cat installer/install_swane.sh |
              /bin/bash -s -- --yes --accept-fsl-license --swane-spec "$GITHUB_WORKSPACE" 2>&1 >&3 3>&- |
              tee "$LOG_2" >&2 3>&-
          } 3>&1 | tee "$SUMMARY_2" || status=$?
          [ "$status" = 0 ] || { echo "::error::The second run failed (exit $status)"; exit "$status"; }
          grep -qxF '==> The system packages for 3D Slicer and the en_US.UTF-8 locale are already installed' "$LOG_2" ||
            { echo "::error::The second run did not find the system packages and the locale already installed"; exit 1; }
          grep -qE '^SWANe installer: FSL .* existing$' "$SUMMARY_2" ||
            { echo "::error::Expected the second run to reuse the FSL of the first one"; exit 1; }
          first="$(grep -E '^SWANe installer: (conda|env) ' "$SUMMARY_1")"
          second="$(grep -E '^SWANe installer: (conda|env) ' "$SUMMARY_2")"
          [ "$first" = "$second" ] || { echo "::error::The second run changed conda or swane-env"; exit 1; }
          if grep -q '^WARNING: ' "$SUMMARY_2"; then
            sed -n 's/^WARNING: \(.*\)/::error::Installer warning: \1/p' "$SUMMARY_2"
            exit 1
          fi
      - name: Check the environment after the second run
        timeout-minutes: 20
        run: bash -l .github/scripts/check_installed_env.sh "$SUMMARY_2"
